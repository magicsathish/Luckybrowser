name: Lucky Dangle Browser v1.0.3 - ARM64 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: lucky-dangle-v1-0-3-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Single ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Find and Safely Extract Project ZIP
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          extract_dir = Path(os.environ["RUNNER_TEMP"]) / "lucky-dangle-v103"

          if extract_dir.exists():
              shutil.rmtree(extract_dir)

          extract_dir.mkdir(parents=True)

          ignored = {
              ".git",
              ".gradle",
              "build",
              "node_modules"
          }

          archives = sorted(
              p for p in workspace.rglob("*")
              if p.is_file()
              and p.suffix.lower() == ".zip"
              and not any(
                  part in ignored
                  for part in p.relative_to(workspace).parts
              )
          )

          print("ZIP files found:")

          for archive in archives:
              print(f" - {archive.relative_to(workspace)}")

          if len(archives) != 1:
              raise SystemExit(
                  f"Expected exactly one project ZIP. Found: {len(archives)}"
              )

          archive = archives[0]

          print(f"Selected ZIP: {archive.name}")

          with zipfile.ZipFile(archive) as zf:

              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  member = PurePosixPath(name)

                  if member.is_absolute() or ".." in member.parts:
                      raise SystemExit(
                          f"Unsafe ZIP entry: {info.filename}"
                      )

                  target = (
                      extract_dir / Path(*member.parts)
                  ).resolve()

                  if (
                      extract_dir.resolve() not in target.parents
                      and target != extract_dir.resolve()
                  ):
                      raise SystemExit(
                          f"ZIP path escape detected: {info.filename}"
                      )

              zf.extractall(extract_dir)

          candidates = []

          settings_files = list(
              extract_dir.rglob("settings.gradle")
          ) + list(
              extract_dir.rglob("settings.gradle.kts")
          )

          for settings in settings_files:

              root = settings.parent

              app_gradle = (
                  (root / "app" / "build.gradle").is_file()
                  or
                  (root / "app" / "build.gradle.kts").is_file()
              )

              manifest = (
                  root / "app" / "src" / "main"
                  / "AndroidManifest.xml"
              ).is_file()

              if app_gradle and manifest:
                  candidates.append(root.resolve())

          candidates = list(dict.fromkeys(candidates))

          if len(candidates) != 1:
              raise SystemExit(
                  "Expected exactly one Android project root. "
                  f"Found: {[str(p) for p in candidates]}"
              )

          project_dir = candidates[0]

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:
              env.write(f"PROJECT_DIR={project_dir}\n")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:
              output.write(f"project_dir={project_dir}\n")

          print(f"Project Root: {project_dir}")
          print("Project structure verified.")
          PY

      - name: 3. Set Up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --channel=3 \
            --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

          if [ ! -d "$SDK_ROOT/platforms/android-37.0" ]; then
            echo "ERROR: Android API 37 installation failed."
            exit 1
          fi

          if [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

          if [ ! -d "$SDK_ROOT/build-tools/36.0.0" ]; then
            echo "ERROR: Build Tools 36.0.0 not installed."
            exit 1
          fi

          echo "Android SDK ready."

      - name: 5. Set Up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 6. Configure ARM64 Only
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/arm64-only.init.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
              allprojects { project ->

                  def androidExtension =
                      project.extensions.findByName("android")

                  if (androidExtension != null) {

                      def defaultConfig =
                          androidExtension.defaultConfig

                      def ndkConfig = defaultConfig.ndk

                      ndkConfig.abiFilters.clear()
                      ndkConfig.abiFilters.add("arm64-v8a")

                      println(
                          "ARM64 ABI filter enabled for: ${project.path}"
                      )
                  }
              }
          }
          GRADLE

          echo "ARM64-only Gradle configuration prepared."

      - name: 7. Build Lucky Dangle v1.0.3
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Project: $PROJECT_DIR"
          echo "Target ABI: arm64-v8a"

          gradle \
            --no-daemon \
            --stacktrace \
            --init-script "$RUNNER_TEMP/arm64-only.init.gradle" \
            assembleDebug

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/final-apk"

          cp "$APK_PATH" \
            "$RUNNER_TEMP/final-apk/LuckyDangleBrowser_v1.0.3_ARM64.apk"

          echo "APK build completed."

      - name: 8. Verify APK Architecture and Size
        shell: bash
        run: |
          set -euo pipefail

          APK="$RUNNER_TEMP/final-apk/LuckyDangleBrowser_v1.0.3_ARM64.apk"

          python3 - "$APK" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          apk = Path(sys.argv[1])

          if not apk.is_file():
              raise SystemExit("ERROR: APK not found.")

          allowed = {"arm64-v8a"}
          found = set()

          with zipfile.ZipFile(apk) as zf:

              for name in zf.namelist():

                  if name.startswith("lib/"):
                      parts = name.split("/")

                      if len(parts) >= 3:
                          abi = parts[1]

                          if abi in {
                              "arm64-v8a",
                              "armeabi-v7a",
                              "armeabi",
                              "x86",
                              "x86_64"
                          }:
                              found.add(abi)

          print("Detected APK ABIs:", sorted(found))

          if not found:
              raise SystemExit(
                  "ERROR: No native ABI libraries detected."
              )

          if found != allowed:
              raise SystemExit(
                  "ERROR: Unexpected ABI detected. "
                  f"Expected only {allowed}, found {found}"
              )

          size_mb = apk.stat().st_size / (1024 * 1024)

          print(f"APK Size: {size_mb:.2f} MB")
          print("ARM64-only verification passed.")
          PY

      - name: 9. Upload Single APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuckyDangleBrowser-v1.0.3-ARM64
          path: ${{ runner.temp }}/final-apk/LuckyDangleBrowser_v1.0.3_ARM64.apk
          if-no-files-found: error
          retention-days: 7

      - name: 10. Publish Single APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lucky-dangle-v1.0.3-arm64-${{ github.run_number }}
          name: Lucky Dangle Browser v1.0.3 ARM64
          body: |
            Lucky Dangle Browser v1.0.3

            Build Configuration:
            - Target ABI: arm64-v8a only
            - Build Type: Debug
            - Java: 17
            - Gradle: 9.3.1
            - Android SDK: 37
            - Build Tools: 36.0.0

            Only one ARM64 APK is included.
            No AAB, Universal APK, ARMv7 or x86 APKs.

          files: ${{ runner.temp }}/final-apk/LuckyDangleBrowser_v1.0.3_ARM64.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
