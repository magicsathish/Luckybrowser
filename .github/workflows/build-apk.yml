name: Lucky Browser ZIP Organizer

on:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract and organize ZIP
        shell: bash
        run: |
          python3 <<'PY'
          import zipfile, shutil, tempfile
          from pathlib import Path

          repo = Path.cwd()
          zips = list(repo.rglob("*.zip"))

          if not zips:
              print("No ZIP found.")
              exit(0)

          if len(zips) != 1:
              raise SystemExit("Upload exactly one ZIP.")

          temp = Path(tempfile.mkdtemp())
          with zipfile.ZipFile(zips[0]) as z:
              for i in z.infolist():
                  target = (temp / i.filename).resolve()
                  if not target.is_relative_to(temp.resolve()):
                      raise SystemExit("Unsafe ZIP path.")
              z.extractall(temp)

          roots = []
          for s in temp.rglob("settings.gradle*"):
              p = s.parent
              if (p / "app/src/main/AndroidManifest.xml").is_file() and any(
                  (p / "app" / f"build.gradle{ext}").is_file()
                  for ext in ("", ".kts")
              ):
                  roots.append(p)

          if len(roots) != 1:
              raise SystemExit("Android project root not uniquely detected.")

          for item in roots[0].iterdir():
              if item.name in (".git", ".github"):
                  continue
              dest = repo / item.name
              if item.is_dir():
                  shutil.copytree(item, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, dest)

          zips[0].unlink()
          print("ZIP extracted and project organized.")
          PY

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (
            git commit -m "Extract and organize Android project"
            git push
          )
